---
DOCUMENTATION:
  name: hosting_secret_files
  short_description: The platform secret files an accepted hosting app declares
  author: Richard Lynch (@Richard-Lynch)
  description:
    - Lists the secrets a PROD app declares beside its compose, each with the secret-store item and
      field to resolve, the service and uid that read it, and the file path, which is derived from
      the tier root, the app name and the key (the app cannot name a host path).
  options:
    _input:
      description: The app definition.
      type: dict
      required: true
    tier_name:
      description: The tier the app is deployed to.
      type: str
      required: true
    tiers:
      description: The tier definitions, keyed by tier name.
      type: dict
      required: true
EXAMPLES: |
  - name: List the secret files to write
    ansible.builtin.set_fact:
      secret_files: "{{ app | richard_lynch.services.hosting_secret_files('prod', tiers) }}"
RETURN:
  _value:
    description: One entry per secret, C({key, item, field, service, uid, path}); empty when none.
    type: list
    elements: dict
