---
namespace: richard_lynch
name: services
version: 1.0.0
readme: README.md
authors:
  - Richard Lynch
description: >-
  Application, media and messaging roles: PostgreSQL with an exporter, a two-tier Docker Compose app-hosting platform with a reviewed-definition gate, arr-style media service compose files, Jellyfin hardware-transcode settings and a transcode-cache reaper, and Slack channel reconciliation and messaging.
license:
  - GPL-3.0-or-later
tags:
  - docker
  - postgresql
  - media
  - slack
  - hosting
dependencies:
  community.docker: ">=4.0.0"
  community.postgresql: ">=3.0.0"
  richard_lynch.common: ">=1.0.0,<2.0.0"
repository: https://github.com/Richard-Lynch/ansible-collection-services
documentation: https://github.com/Richard-Lynch/ansible-collection-services/blob/main/README.md
homepage: https://github.com/Richard-Lynch/ansible-collection-services
issues: https://github.com/Richard-Lynch/ansible-collection-services/issues
build_ignore:
  - .ansible-lint
  - configured_roles.txt
  - roles/*/defaults/SKIP
  - .github
  - .gitignore
  - collections.galaxy
  - devkit.toml
  - dist
  - export.manifest
  - tests/output
  - roles/*/meta/argument_specs.py
  - roles/*/molecule
  - "*.tar.gz"
