---
namespace: richard_lynch
name: services
version: 2.0.1
readme: README.md
authors:
  - Richard Lynch
description: >-
  Application, media, messaging and AI-agent roles: PostgreSQL with an exporter, a two-tier Docker Compose app-hosting platform with a reviewed-definition gate, arr-style media service compose files, Jellyfin transcode settings and a cache reaper, Slack channel reconciliation and messaging, and a self-hosted AI agent stack: the Hermes agent with policy hooks, profiles, learning jobs, state backup and MCP clients, a LiteLLM gateway with Open WebUI, a sandboxed coding worker, a mailbox code reader and a model catalogue explorer.
license:
  - GPL-3.0-or-later
tags:
  - docker
  - postgresql
  - media
  - slack
  - hosting
  - ai
  - llm
  - agents
dependencies:
  ansible.posix: ">=2.0.0"
  ansible.utils: ">=5.0.0"
  community.docker: ">=4.0.0"
  community.general: ">=10.0.0"
  community.postgresql: ">=3.0.0"
  richard_lynch.common: ">=1.0.0,<2.0.0"
repository: https://github.com/Richard-Lynch/ansible-collection-services
documentation: https://github.com/Richard-Lynch/ansible-collection-services/blob/main/README.md
homepage: https://github.com/Richard-Lynch/ansible-collection-services
issues: https://github.com/Richard-Lynch/ansible-collection-services/issues
build_ignore:
  - .ansible-lint
  - ci
  - configured_roles.txt
  - roles/*/defaults/SKIP
  - .github
  - .gitignore
  - collections.galaxy
  - devkit.toml
  - dist
  - export.manifest
  - tests/output
  - roles/*/meta/argument_specs.py
  - roles/*/molecule
  - "*.tar.gz"
