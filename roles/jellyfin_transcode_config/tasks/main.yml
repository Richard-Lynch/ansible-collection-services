---
# Sets Jellyfin's hardware-transcode settings in encoding.xml.
#
# RUNS ON THE HOST THAT HOLDS THE CONFIG, natively. Wrapping each operation in a container or
# hypervisor exec instead means escaping sed patterns through two shell layers, where doubled
# backslashes silently swallow the pattern and every value reads as "<absent>". Native modules also
# give idempotence and check mode for free.
#
# See the role's README.

- name: Resolve declared options over their generated defaults
  # GENERATED from meta/argument_specs.py — binds every declared option to its default, so a
  # default can never be declared-but-dead (the variable evaluating Undefined at run time).
  ansible.builtin.include_tasks: _resolve_defaults.yml

- name: Apply the generated argspec guards
  # The range constraints Ansible's argspec validator cannot enforce (min_value on the segment and
  # throttle seconds); without this include they are declared and never checked.
  ansible.builtin.include_tasks: _argspec_guards.yml

- name: Setup vars
  ansible.builtin.include_tasks: setup_vars.yml

# --- 1. establish what is there now ---------------------------------------------------------------
- name: Check the encoding configuration exists
  ansible.builtin.stat:
    path: "{{ jtc_config_path }}"
  register: _jtc_stat

- name: HARD GATE — the config must exist
  # Refusing beats creating a fresh encoding.xml: Jellyfin owns this file and it holds ~45 settings,
  # so a hand-built replacement would drop everything this role does not know about.
  ansible.builtin.assert:
    that:
      - _jtc_stat.stat.exists
      - _jtc_stat.stat.isreg
    fail_msg: >-
      {{ jtc_config_path }} does not exist (or is not a regular file) on {{ inventory_hostname }}.
      Jellyfin creates it on first run — start the container at least once before configuring it.
    success_msg: "Found {{ jtc_config_path }}."
    quiet: true

- name: Read the current values
  # community.general.xml would be more elegant but needs lxml on the target, which a minimal
  # host often lacks. The file is machine-generated by Jellyfin with one element per line, so a
  # sed extraction is reliable here and adds no dependency.
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      for k in {{ _jtc_desired.keys() | join(' ') }}; do
        v=$(sed -n "s|.*<${k}>\(.*\)</${k}>.*|\1|p" {{ jtc_config_path | quote }} 2>/dev/null | head -1)
        echo "${k}=${v:-<absent>}"
      done
  register: _jtc_before
  changed_when: false

- name: Parse the current values
  ansible.builtin.set_fact:
    _jtc_cur: "{{ dict(_jtc_before.stdout_lines | map('split', '=', 1) | list) }}"

- name: Report current vs desired
  ansible.builtin.debug:
    msg: >-
      {{ '%-28s now=%-24s want=%s' % (item.key,
                                      _jtc_cur[item.key] | default('<absent>'),
                                      item.value) }}{{
         '' if (_jtc_cur[item.key] | default('')) == (item.value | string) else '   <-- WOULD CHANGE' }}
  loop: "{{ _jtc_desired | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Report that this is a dry run
  ansible.builtin.debug:
    msg: >-
      DRY RUN — {{ jtc_config_path }} was NOT modified. Re-run with jtc_apply=true.
      NOTE Jellyfin REWRITES this file whenever a setting changes in its web UI, so this role and
      the UI are two sources of truth for the same file. Once used, treat the role as authoritative
      for the settings it manages.
  when: not (jtc_apply | bool)

# --- 2. apply ---------------------------------------------------------------------------------------
- name: Apply the transcode settings
  when: jtc_apply | bool
  block:
    - name: Back up the current encoding.xml
      # force: false so a re-run cannot overwrite the ORIGINAL settings with already-modified ones,
      # destroying the only route back to what was there before this role first ran.
      ansible.builtin.copy:
        src: "{{ jtc_config_path }}"
        dest: "{{ jtc_config_path }}.bak-{{ _jtc_stamp }}"
        remote_src: true
        mode: "0644"
        force: false

    - name: Set each managed value
      # lineinfile per element rather than templating the file. encoding.xml holds ~45 settings;
      # rendering it whole would silently reset everything this role does not manage, including
      # anything a future Jellyfin version adds.
      #
      # backrefs: true means a NON-matching line is left alone rather than appended — so an element
      # Jellyfin has renamed or removed produces no change instead of a duplicate stray line. The
      # read-back gate below is what turns that silence into a failure.
      ansible.builtin.lineinfile:
        path: "{{ jtc_config_path }}"
        regexp: "^(\\s*)<{{ item.key }}>[^<]*</{{ item.key }}>\\s*$"
        line: "\\1<{{ item.key }}>{{ item.value }}</{{ item.key }}>"
        backrefs: true
      loop: "{{ _jtc_desired | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
      register: _jtc_set

    - name: Read the settings back from disk
      # lineinfile with backrefs reports changed=false when NOTHING matched, which is
      # indistinguishable from "already correct" without actually looking. This looks.
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          for k in {{ _jtc_desired.keys() | join(' ') }}; do
            v=$(sed -n "s|.*<${k}>\(.*\)</${k}>.*|\1|p" {{ jtc_config_path | quote }} 2>/dev/null | head -1)
            echo "${k}=${v:-<absent>}"
          done
      register: _jtc_after
      changed_when: false

    - name: HARD GATE — every managed value must now be set as intended
      # Compares the WHOLE map, so a single unset element fails the run rather than passing on the
      # strength of the others.
      vars:
        _got: "{{ dict(_jtc_after.stdout_lines | map('split', '=', 1) | list) }}"
      ansible.builtin.assert:
        that:
          - _got == _jtc_desired
        fail_msg: >-
          Settings did not take.
          on disk: {{ _got }}
          wanted:  {{ _jtc_desired }}
          RESTORE: cp {{ jtc_config_path }}.bak-{{ _jtc_stamp }} {{ jtc_config_path }}
        success_msg: "All {{ _jtc_desired | length }} managed settings verified on disk."
        quiet: true

    - name: Restart Jellyfin to pick up the configuration
      # REQUIRED. Jellyfin reads encoding.xml at startup and caches it; without a restart the
      # running process keeps the old settings AND will overwrite the file from its in-memory copy
      # the next time anything changes a setting in the UI — silently reverting this role's work.
      no_log: true  # INSPECTENV-01: the result carries every Env VALUE
      community.docker.docker_container:
        name: "{{ jtc_container }}"
        restart: true
        state: started
      register: _jtc_restart_res
      when: jtc_restart | bool

    - name: Wait for Jellyfin to be running again
      no_log: true  # INSPECTENV-01: the result carries every Env VALUE
      community.docker.docker_container_info:
        name: "{{ jtc_container }}"
      register: _jtc_info
      until: _jtc_info.container.State.Running | default(false)
      retries: 18
      delay: 5
      when: jtc_restart | bool
      # guard-check: ignore UNTIL-01 — the required assert IS the next task ("HARD GATE — Jellyfin
      # must be running again"), re-checking _jtc_info.container.State.Running. The scanner misses
      # it because the assert carries a `when:` and sits inside the same block.

    - name: HARD GATE — Jellyfin must be running again
      # Explicit assert AFTER the until loop: a retry loop that exhausts its retries still
      # continues, so without this a Jellyfin that never came back would exit green.
      ansible.builtin.assert:
        that:
          - _jtc_info.container.State.Running | default(false)
        fail_msg: >-
          {{ jtc_container }} did not come back after the restart.
          RESTORE: cp {{ jtc_config_path }}.bak-{{ _jtc_stamp }} {{ jtc_config_path }}
          then restart the container.
        success_msg: "{{ jtc_container }} is running with the new configuration."
        quiet: true
      when: jtc_restart | bool

    - name: Report what changed and how to undo it
      ansible.builtin.debug:
        msg:
          - "Jellyfin hardware transcode configured:"
          - "  acceleration: {{ jtc_accel_type }}   device: {{ jtc_device }}"
          - "  HEVC encode: {{ jtc_allow_hevc }}    AV1 encode: {{ jtc_allow_av1 }}"
          - "  tone mapping: {{ jtc_tonemapping }}"
          - "Backup:   {{ jtc_config_path }}.bak-{{ _jtc_stamp }}"
          - "ROLLBACK: cp {{ jtc_config_path }}.bak-{{ _jtc_stamp }} {{ jtc_config_path }}"
          - "          && docker restart {{ jtc_container }}"
