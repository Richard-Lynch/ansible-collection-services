---
- name: Converge — dry-run the role against a fixture encoding.xml
  hosts: localhost
  gather_facts: true
  vars:
    fixture_dir: /tmp/molecule-jellyfin-transcode-config
  tasks:
    - name: Create the fixture directory
      ansible.builtin.file:
        { path: "{{ fixture_dir }}", state: directory, mode: "0755" }

    - name: Write a fixture encoding.xml (one element per line, as Jellyfin writes it)
      ansible.builtin.copy:
        dest: "{{ fixture_dir }}/encoding.xml"
        mode: "0644"
        content: |
          <?xml version="1.0" encoding="utf-8"?>
          <EncodingOptions xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <HardwareAccelerationType>none</HardwareAccelerationType>
            <VaapiDevice>/dev/dri/renderD128</VaapiDevice>
            <QsvDevice />
            <EnableHardwareEncoding>true</EnableHardwareEncoding>
            <EnableTonemapping>false</EnableTonemapping>
            <EnableThrottling>false</EnableThrottling>
            <ThrottleDelaySeconds>180</ThrottleDelaySeconds>
            <SegmentKeepSeconds>720</SegmentKeepSeconds>
          </EncodingOptions>

    - name: Dry run (jtc_apply false)
      ansible.builtin.include_role:
        name: jellyfin_transcode_config
      vars:
        jtc_device: /dev/dri/renderD129
        jtc_config_path: "{{ fixture_dir }}/encoding.xml"
