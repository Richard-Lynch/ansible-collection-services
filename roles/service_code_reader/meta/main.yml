---
galaxy_info:
  role_name: service_code_reader
  namespace: richard_lynch
  author: Richard Lynch
  description: >-
    Deploy a one-shot verification-code reader: polls a dedicated mailbox, keeps each code from an
    allowlisted sender for a short TTL and hands it once, over loopback and a bearer token, to an
    agent's browser filler, so the language model never sees the code.
  license: GPL-3.0-or-later
  min_ansible_version: "2.19"
  galaxy_tags: [agent, email, imap, verification]
dependencies: []
