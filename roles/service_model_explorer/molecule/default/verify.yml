---
# Asserts on the ARTIFACTS the role's own template produced and on the REAL role's refusals, not
# on a hand-typed copy of the role's logic.
- name: Verify — the rendered compose project and the image gates
  hosts: localhost
  gather_facts: false
  vars:
    render_root: /tmp/molecule-mx
  tasks:
    - name: Read the rendered compose files
      ansible.builtin.slurp:
        src: "{{ render_root }}/{{ item }}/docker-compose.yml"
      register: _compose
      loop: [first, second]

    - name: Parse them as YAML, so a template that renders INVALID yaml fails here
      ansible.builtin.set_fact:
        _first: "{{ (_compose.results[0].content | b64decode | from_yaml).services['model-explorer'] }}"
        _second: "{{ (_compose.results[1].content | b64decode | from_yaml).services['other-explorer'] }}"
        _first_raw: "{{ _compose.results[0].content | b64decode }}"
        _second_raw: "{{ _compose.results[1].content | b64decode }}"

    - name: The image is the digest reference the caller gave, on both renders
      ansible.builtin.assert:
        that:
          - _first.image == 'ghcr.io/example/model-explorer@sha256:' ~ ('a' * 64)
          - _second.image == 'registry.example.org/mirror/explorer@sha256:' ~ ('b' * 64)
        fail_msg: "The rendered image is not the caller's digest reference: {{ _first.image }} / {{ _second.image }}"
        quiet: true

    - name: The catalogue is a READ-ONLY DIRECTORY mount, the root filesystem is read-only
      # A directory: a file-level bind mount pins the inode and the snapshot is replaced by rename.
      ansible.builtin.assert:
        that:
          - _first.volumes == [render_root ~ '/first/catalogue:/srv/catalogue:ro']
          - _second.volumes == [render_root ~ '/second/catalogue:/srv/catalogue:ro']
          - _first.read_only | bool
          - "'/tmp' in _first.tmpfs"
        fail_msg: "Unexpected mounts or root filesystem: {{ _first.volumes }} read_only={{ _first.read_only | default('unset') }}"
        quiet: true

    - name: The port mapping comes from the variable and targets the image's 8080
      ansible.builtin.assert:
        that:
          - _first.ports == ['8092:8080']
          - _second.ports == ['9191:8080']
        fail_msg: "Ports: {{ _first.ports }} / {{ _second.ports }}"
        quiet: true

    - name: NO CREDENTIAL may reach the rendered compose project
      # The app is read-only and holds nothing. If a credential is ever added to this stack, this
      # fails and makes the change argue for it.
      ansible.builtin.assert:
        that:
          - not (_first_raw | lower is search('api_key|api-key|master_key|master-key|password|secret|token|bearer'))
          - not (_second_raw | lower is search('api_key|api-key|master_key|master-key|password|secret|token|bearer'))
        fail_msg: A credential-shaped key reached the rendered compose project.
        quiet: true

    - name: The second caller's render carries NONE of the first variant's values
      ansible.builtin.assert:
        that:
          - not (_second_raw is search('model-explorer'))
          - not (_second_raw is search('8092'))
          - not (_second_raw is search('explorer-net'))
          - not (_second_raw is search('a' * 64))
          - not (_second_raw is search('Etc/UTC'))
        fail_msg: The second render still contains a first-variant value, so the template hardcodes it.
        quiet: true

    - name: Read the refusal results
      ansible.builtin.slurp:
        src: "{{ render_root }}/refusals.json"
      register: _refusals_raw

    - name: Parse them
      ansible.builtin.set_fact:
        _refusals: "{{ _refusals_raw.content | b64decode | from_json }}"

    - name: Read the compose file the real _compose entrypoint rendered
      ansible.builtin.slurp:
        src: "{{ render_root }}/deploy/docker-compose.yml"
      register: _deployed

    - name: The real render landed in the destination and runs the caller's digest
      # Fails when the compose source resolves to the wrong role (nothing is rendered, so the slurp
      # above fails first) or the template ignores model_explorer_image.
      ansible.builtin.assert:
        that:
          - (_deployed.content | b64decode | from_yaml).services['model-explorer'].image == 'ghcr.io/example/model-explorer@sha256:' ~ ('a' * 64)
          - (_deployed.content | b64decode | from_yaml).services['model-explorer'].volumes == [render_root ~ '/deploy/catalogue:/srv/catalogue:ro']
        fail_msg: "The deployed compose file does not run the caller's digest."
        quiet: true

    - name: The role REFUSES a missing image reference, at argspec validation
      ansible.builtin.assert:
        that:
          - _refusals.missing.failed
          - "'model_explorer_image' in _refusals.missing.msg"
        fail_msg: "A missing image reference was not refused for the right reason: {{ _refusals.missing }}"
        quiet: true

    - name: The role REFUSES a tag, at its digest gate
      ansible.builtin.assert:
        that:
          - _refusals.tag.failed
          - "'pinned by digest' in _refusals.tag.msg"
        fail_msg: "A tag was not refused by the digest gate: {{ _refusals.tag }}"
        quiet: true
