---
dependency: { name: galaxy }
driver: { name: default }
platforms: [{ name: localhost }]
provisioner:
  name: ansible
  inventory: { host_vars: { localhost: { ansible_connection: local } } }
  # Molecule runs from the scenario directory, so include_role of this very role needs the roles
  # directory on the path (the refusal cases below include the real role).
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../"
    # The role's FQCN dependencies (richard_lynch.common, community.docker): the installed tree, and
    # the tree holding this collection itself (molecule does not read ansible.cfg).
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/../../collections.galaxy:${MOLECULE_PROJECT_DIRECTORY}/../../../../.."
  playbooks: { converge: converge.yml, verify: verify.yml }
verifier: { name: ansible }
scenario:
  # No idempotence step: converge starts by DELETING the render root so each run renders from a
  # known-clean state, which makes a second converge "changed" by construction. A stale artifact
  # from a previous run would otherwise satisfy verify's asserts and hide a template that had
  # stopped rendering. The role's own converge needs a Docker daemon; its idempotence (compose
  # `recreate: auto`) and its health/digest read-backs are exercised on a real host.
  test_sequence: [syntax, converge, verify]
