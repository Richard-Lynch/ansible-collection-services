---
# service_model_explorer — run the model-explorer image, pinned by digest, with the caller's
# catalogue snapshot mounted read-only.
#
# Gate the inputs, render the compose project, ship the snapshot, converge, then PROVE the result
# with read-backs rather than trusting the deploy's own exit code.
#
# WHAT THIS ROLE DOES NOT DO: it does not build the app (the image is built and released by the
# model-explorer repository's CI, which records each release's digest), and it does not talk to
# the gateway (the catalogue snapshot is the caller's data, model_explorer_catalogue_src).

- name: Resolve declared defaults
  ansible.builtin.include_tasks: _resolve_defaults.yml

# ---------------------------------------------------------------------------------------
# Preflight. Both gates run before anything touches the host.
# ---------------------------------------------------------------------------------------
- name: HARD GATE — the image is pinned by DIGEST
  # A tag can be moved, so a tag would let what runs change with no change here. The argspec
  # already refuses a missing ref; this refuses a tag, a bare name and a malformed digest.
  ansible.builtin.assert:
    that:
      - model_explorer_image is string
      - model_explorer_image is match('^[a-z0-9][a-z0-9._/:-]*@sha256:[0-9a-f]{64}$')
    fail_msg: >-
      model_explorer_image must be an image reference pinned by digest (name@sha256:<64 hex>),
      got '{{ model_explorer_image }}'. Each model-explorer release records its digest in its
      release notes and in image-digest.txt.
    quiet: true

# The catalogue is what makes the app useful. Without it every page load shows "could not load
# the catalogue", so it is checked before deploying.
- name: Stat the catalogue snapshot on the controller
  ansible.builtin.stat:
    path: "{{ model_explorer_catalogue_src }}"
  register: model_explorer__cat_stat
  delegate_to: localhost

- name: HARD GATE — the catalogue snapshot must exist and be non-empty
  ansible.builtin.assert:
    that:
      - model_explorer__cat_stat.stat.exists
      - model_explorer__cat_stat.stat.size > 0
    fail_msg: >-
      model_explorer_catalogue_src ({{ model_explorer_catalogue_src }}) is missing or empty, so
      every page load would show "could not load the catalogue". Generate the snapshot first.
    quiet: true

# ---------------------------------------------------------------------------------------
# Config
# ---------------------------------------------------------------------------------------
- name: Render the compose project
  # _compose.yml resolves the source path in THIS role's context before including
  # deployment_config; see there for why that matters.
  ansible.builtin.include_tasks: _compose.yml

- name: Ensure the catalogue directory exists
  # Mounted into the container as a DIRECTORY (/srv/catalogue). A file-level bind mount pins the
  # inode, and `copy` replaces the file by an atomic rename, so the container would keep serving
  # the snapshot it started with.
  ansible.builtin.file:
    path: "{{ model_explorer_config_dir }}/catalogue"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ship the catalogue snapshot
  # World-readable: the image runs nginx as an unprivileged user.
  ansible.builtin.copy:
    src: "{{ model_explorer_catalogue_src }}"
    dest: "{{ model_explorer_config_dir }}/catalogue/catalogue.json"
    owner: root
    group: root
    mode: "0644"

- name: Ensure the shared docker network exists
  community.docker.docker_network:
    name: "{{ model_explorer_network }}"
    attachable: true
    state: present

# ---------------------------------------------------------------------------------------
# Converge
# ---------------------------------------------------------------------------------------
# A new digest changes the rendered compose file, and `recreate: auto` recreates the container
# for a changed image or config. A refreshed snapshot needs nothing: the directory mount serves
# the new file on the next request.
- name: Deploy the model explorer
  community.docker.docker_compose_v2:
    project_src: "{{ model_explorer_config_dir }}"
    state: present
    pull: missing
    recreate: auto

# ---------------------------------------------------------------------------------------
# Read-backs. A deploy that "succeeded" is not evidence the app works.
# ---------------------------------------------------------------------------------------
- name: Wait for the container's own healthcheck to report healthy
  # The image's HEALTHCHECK fetches index.html from 127.0.0.1:8080. Read as Health.Status, so a
  # container that runs but never turns healthy fails here instead of being reported as up.
  no_log: true # INSPECTENV-01: the result carries every Env VALUE
  community.docker.docker_container_info:
    name: "{{ model_explorer_container_name }}"
  register: model_explorer__container
  until: >-
    ((model_explorer__container.container | default({}, true)).get('State', {}).get('Health', {})
      .get('Status', '')) == 'healthy'
  retries: 12
  delay: 5
  failed_when: false
  changed_when: false

- name: Keep only the fields the gates read
  ansible.builtin.set_fact:
    model_explorer__state:
      status: "{{ (model_explorer__container.container | default({}, true)).get('State', {}).get('Status', 'ABSENT') }}"
      health: "{{ (model_explorer__container.container | default({}, true)).get('State', {}).get('Health', {}).get('Status', 'none') }}"
      image: "{{ (model_explorer__container.container | default({}, true)).get('Config', {}).get('Image', '') }}"

- name: HARD GATE — the container runs the pinned digest and is healthy
  # The wait above exhausts and continues, so this is what fails a container that never turned
  # healthy. The image is compared as the reference compose was given (Config.Image), so a
  # container left on an earlier digest fails too.
  ansible.builtin.assert:
    that:
      - model_explorer__state.status == 'running'
      - model_explorer__state.health == 'healthy'
      # Under --check the converge that would move the container to a new digest is skipped, so
      # the container legitimately still runs the previous one: the digest is compared on a real
      # run alone, and running + healthy are still required.
      - ansible_check_mode or model_explorer__state.image == model_explorer_image
    fail_msg: >-
      {{ model_explorer_container_name }}: state {{ model_explorer__state.status }}, health
      {{ model_explorer__state.health }}, image {{ model_explorer__state.image }} (want
      {{ model_explorer_image }}). ABSENT means it does not exist: check `docker compose ps` and
      the project's logs in {{ model_explorer_config_dir }}.
    quiet: true

- name: Verify the app answers over HTTP
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ model_explorer_host_port }}/index.html"
    method: GET
    status_code: [200]
    return_content: true
  register: model_explorer__index
  retries: 6
  delay: 5
  until: model_explorer__index.status | default(0) == 200
  changed_when: false
  # A read: it runs under --check too.
  check_mode: false

- name: HARD GATE — the served page must be the app, not merely a 200
  # nginx's welcome page, a directory listing and an error page are all 200s. This asserts the
  # served HTML carries the app's own title and its module bundle.
  ansible.builtin.assert:
    that:
      - "'Model Explorer' in model_explorer__index.content"
      - "'type=\"module\"' in model_explorer__index.content"
    fail_msg: >-
      The app's port answered 200 but did not serve the app's own index.html.
    quiet: true

# The catalogue is a SEPARATE request: the page and its data fail independently, and index.html
# can serve perfectly while catalogue.json 404s.
- name: Verify the catalogue snapshot is served and parseable
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ model_explorer_host_port }}/catalogue.json"
    method: GET
    status_code: [200]
    return_content: true
  register: model_explorer__catalogue
  changed_when: false
  check_mode: false

- name: HARD GATE — the served catalogue must parse and carry models
  # Parsed with `content | from_json` rather than `.json`: `uri` populates `.json` only when the
  # RESPONSE declares a JSON content-type.
  ansible.builtin.assert:
    that:
      - model_explorer__catalogue.content | from_json is mapping
      - (model_explorer__catalogue.content | from_json).get('enumerated', []) | length > 0
      - (model_explorer__catalogue.content | from_json).get('openrouter', []) | length > 0
    fail_msg: >-
      The served catalogue.json is missing, unparseable, or carries no models. Check
      model_explorer_catalogue_src ({{ model_explorer_catalogue_src }}) and re-run.
    quiet: true

# ---------------------------------------------------------------------------------------
# Cleanup, LAST. Only once every gate above has passed: the new container runs the pinned
# digest, is healthy and serves the app and the catalogue. Before that, the previous container may
# still be the one serving, and it bind-mounts these paths.
# ---------------------------------------------------------------------------------------
- name: Remove what versions before 2.0.0 installed (a copied bundle and nginx config)
  # Before 2.0.0 the role copied a built bundle into site/ and rendered nginx.conf; the image
  # carries both now.
  ansible.builtin.file:
    path: "{{ model_explorer_config_dir }}/{{ item }}"
    state: absent
  loop: [site, nginx.conf]
