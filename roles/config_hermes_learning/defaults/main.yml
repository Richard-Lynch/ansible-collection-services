# AUTO-GENERATED defaults file — DO NOT EDIT.
#
# Source of truth: roles/config_hermes_learning/meta/argument_specs.py
# Regenerate:      venv/bin/python tools/argspec/cli.py x generate config_hermes_learning
#
# Edits here are silently overwritten on the next generation. To change a value or its
# documentation, change the OptionSpec in the source file above — descriptions there
# are emitted as the comments in this file.
# Entrypoint:      main

# The agent's container name.
hermes_learning_container__default: hermes

# The agent's own interpreter inside the container.
hermes_learning_container_python__default: /opt/hermes/.venv/bin/python

# Working directory inside the container (the app checkout).
hermes_learning_container_workdir__default: /opt/hermes

# uid the inner scripts run as, so anything staged is owned by the agent exactly as
# its own writes are. 10000 is the image's hermes uid.
hermes_learning_exec_user__default: '10000'

# HERMES_HOME as the container sees it.
hermes_learning_home__default: /opt/data

# docker runs each inner script through docker exec. local runs it with the host
# interpreter against hermes_learning_host_home: the molecule scenario only.
hermes_learning_exec_mode__default: docker

# The hermes CLI inside the container (plugin install and read-back).
hermes_learning_hermes_cli__default: hermes

# Where the scripts go.
hermes_learning_install_dir__default: /usr/local/lib/hermes-learning

# config.json and probes.json. Secret-free by construction.
hermes_learning_config_dir__default: /etc/hermes-learning

# Root-only state: the weekly ledger, probe history, ping de-duplication.
hermes_learning_state_dir__default: /var/lib/hermes-learning

# Directory under the state root for the mirror copies (ledger, probes, consolidation
# proposals). Add it to agent_state_mirror_paths to have it committed nightly.
hermes_learning_dir__default: learning

# Container path of the recall test's scratch store. Exclude it from the backup and
# the mirror: it holds test notes, not the user's memory.
hermes_learning_recall_scratch__default: /opt/data/learning/recall-scratch

# Path under the state root listing bundled skill names, left out of skills_total.
hermes_learning_skip_names_file__default: ''

# The agent's API server as seen from inside its own container.
hermes_learning_api_url__default: http://127.0.0.1:8642

# NAME of the container env var holding the API server key.
hermes_learning_api_key_env__default: API_SERVER_KEY

# Per-probe wait for a terminal run.
hermes_learning_probe_timeout_s__default: 180

# The loss cap: a proposal leaving more than this fraction of prior MEMORY.md
# entries uncited is refused and never staged.
hermes_learning_consolidate_max_loss__default: 0.25

# Below this many entries there is nothing worth consolidating.
hermes_learning_consolidate_min_entries__default: 8

# A pending write older than this pings Slack (24 h by default).
hermes_learning_ping_age_s__default: 86400

# The same pending write is pinged again at most this often.
hermes_learning_ping_repeat_s__default: 86400

# NAME of the container env var holding the Slack bot token.
hermes_learning_slack_token_env__default: SLACK_BOT_TOKEN

# NAME of the container env var holding the Slack channel id to post to.
hermes_learning_slack_channel_env__default: SLACK_HOME_CHANNEL

# Window the weak-model guard reads state.db over for memory claims with no memory
# tool call. 0 disables the read.
hermes_learning_claims_window_s__default: 90000

# Enable and start the three timers. False only where there is no systemd.
hermes_learning_enable_timers__default: true

# Where the units are written.
hermes_learning_unit_dir__default: /etc/systemd/system

# Ledger, pending ages and the 24 h ping.
hermes_learning_hourly_oncalendar__default: hourly

# The nightly probe set.
hermes_learning_probes_oncalendar__default: '*-*-* 03:30:00'

# The weekly consolidation proposal.
hermes_learning_consolidate_oncalendar__default: Sun *-*-* 04:00:00

# The compose project directory restarted after a plugin install.
hermes_learning_stack_dir__default: /opt/hermes

# Host-side URL that answers 200 once the agent is back after that restart.
hermes_learning_health_url__default: http://127.0.0.1:8642/health

# Catalog name of the memory provider plugin to install, pinned (empty: built-in
# memory only). Its activation is memory.provider in config.yaml, owned by
# service_hermes through hermes_config_owned.
hermes_learning_memory_plugin__default: ''

# config.yaml section the plugin reads its settings from (plugins.<section>);
# Holographic's is hermes-memory-store.
hermes_learning_memory_plugin_section__default: ''

# Scalar settings written under plugins.<section> with the agent's own
# `hermes config set`, read back with `hermes config get`. Env-var NAMES only, never
# a credential: the plugin reads the key from the variable it is told to.
hermes_learning_memory_plugin_settings__default: {}

# The 40-character commit the plugin is installed at (hermes plugins install --ref).
hermes_learning_memory_plugin_ref__default: ''

# The version label the read-back requires hermes plugins list to report.
hermes_learning_memory_plugin_version__default: ''
